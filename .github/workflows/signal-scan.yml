name: signal-scan

on:
  schedule:
    # UTC。日〜金のみ（FXは日曜22:00UTC開場〜金曜22:00UTC閉場）。土曜は動かさない。
    # 実行時間を絞って Actions 分数を節約したい場合は、時を限定する（例: "*/5 13-23,0-2 * * 1-5"）
    - cron: "*/5 * * * 0-5"
  workflow_dispatch:

concurrency:
  group: signal-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # signals.csv を最後にコミットした時刻 = シナリオの有効開始時刻。
      # 手動で上書きしたいときは Repository variables に SIGNAL_SINCE（例 2026-10-03T09:00:00+09:00）
      - name: Plan start time
        id: since
        run: echo "since=$(git log -1 --format=%cI -- signals.csv)" >> "$GITHUB_OUTPUT"

      - name: Scan
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          SIGNAL_SINCE: ${{ vars.SIGNAL_SINCE || steps.since.outputs.since }}
        run: python3 -m scanner.main --csv signals.csv

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/notified.json
          git diff --cached --quiet || (git commit -m "update notified state" && git pull --rebase && git push)
